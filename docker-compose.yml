name: libraryapi

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: library-api:local
    container_name: library-api
    ports:
      - "${API_PORT:-8777}:8000"
    env_file:
      - .env
    environment:
      APP_URL: "http://localhost:${API_PORT:-8777}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: library
      DB_USERNAME: library
      DB_PASSWORD: library
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - uploads:/var/www/html/public/uploads
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: library-db
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: library
      MYSQL_PASSWORD: library
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  db_data:
  uploads:
